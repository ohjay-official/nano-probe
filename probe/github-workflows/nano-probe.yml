name: nano-probe

# Two throwaway checks, meant to run on Nov 12-13, 2026 (Africa/Lagos),
# as soon as the public repo exists.
# 1) nano: can branded Google Chrome on a GitHub-hosted Linux runner
#    (public repo: 4 vCPU, 16 GB RAM) run Gemini Nano? This is the filming probe.
# 2) extension: can that same branded Chrome load our MV3 side-panel extension
#    via CDP Extensions.loadUnpacked, and can Firebase AI Logic hybrid run there
#    with an App Check debug token?
# The two jobs are independent. A failure in one must not hide the other result.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nano-probe.yml'
      - 'probe/**'

permissions:
  contents: read

jobs:
  nano:
    name: Gemini Nano in branded Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Machine facts
        run: |
          echo "cpus: $(nproc)"; free -h; df -h / /mnt || true
          google-chrome --version
          lscpu | grep -E 'Model name|Flags' | cut -c1-200

      - name: Free disk space (Chrome wants about 22 GB free)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / /mnt || true

      - name: Pick profile volume
        run: |
          if sudo mkdir -p /mnt/nano && sudo chown "$USER" /mnt/nano; then
            echo "PROFILE_DIR=/mnt/nano/profile" >> "$GITHUB_ENV"
          else
            echo "PROFILE_DIR=$RUNNER_TEMP/nano-profile" >> "$GITHUB_ENV"
          fi

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg xvfb >/dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install probe deps
        working-directory: probe
        run: npm ci

      - name: Run Gemini Nano probe
        working-directory: probe
        env:
          PROBE_TIMEOUT_MIN: '40'
        run: bash run-ci.sh

      - name: Summary
        if: always()
        working-directory: probe
        run: |
          {
            echo '## Nano probe (filming)'
            echo '```json'
            node -e "const d=require('./out/result.json');console.log(JSON.stringify({result:d.probe&&d.probe.result,availabilityBefore:d.probe&&d.probe.availabilityBefore,createMs:d.probe&&d.probe.createMs,promptMs:d.probe&&d.probe.promptMs,answer:d.probe&&d.probe.answer,error:(d.probe&&d.probe.error)||d.fatal,chrome:d.version&&d.version.Browser},null,2))" || echo 'no result.json'
            echo '```'
            echo
            echo 'Pass means the summary includes PROBE RESULT: on-device-ok and a Nano answer.'
            echo 'If this job is not on-device-ok, start finding a 16 GB laptop now.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nano-probe-out
          path: probe/out
          retention-days: 30
          if-no-files-found: warn

  extension:
    name: App Check and Firebase AI Logic in a side panel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Require Firebase secrets
        run: |
          if [ -z "${{ secrets.FIREBASE_API_KEY }}" ] || [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ] || [ -z "${{ secrets.FIREBASE_APP_ID }}" ] || [ -z "${{ secrets.FIREBASE_APPCHECK_DEBUG_TOKEN }}" ]; then
            echo 'Missing GitHub secrets. Add FIREBASE_API_KEY, FIREBASE_AUTH_DOMAIN, FIREBASE_PROJECT_ID, FIREBASE_STORAGE_BUCKET, FIREBASE_MESSAGING_SENDER_ID, FIREBASE_APP_ID, and FIREBASE_APPCHECK_DEBUG_TOKEN.'
            echo 'See probe/README.md.'
            exit 1
          fi

      - name: Machine facts
        run: |
          google-chrome --version
          echo "cpus: $(nproc)"; free -h

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install probe deps
        working-directory: probe
        run: npm ci

      - name: Install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null

      - name: Write extension Firebase config from secrets
        working-directory: probe
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APPCHECK_DEBUG_TOKEN }}
        run: node write-extension-config.mjs

      - name: Bundle the side panel (Firebase must be local; MV3 forbids remote scripts)
        working-directory: probe
        run: npm run bundle:extension

      - name: Run extension probe
        working-directory: probe
        run: bash run-extension-ci.sh

      - name: Summary
        if: always()
        working-directory: probe
        run: |
          {
            echo '## Extension probe (Firebase AI Logic + App Check debug token)'
            echo '```json'
            node -e "const d=require('./out-extension/result.json');console.log(JSON.stringify(d,null,2))" || echo 'no result.json'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-probe-out
          path: probe/out-extension
          retention-days: 30
          if-no-files-found: warn
